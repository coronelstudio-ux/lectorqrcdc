<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lector QR de facturas SET</title>
<meta name="theme-color" content="#1A73E8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lector QR">
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; background: #fafafa; color: #222; }
  h1 { font-size: 19px; margin: 0 0 10px; }
  label { font-size: 14px; color: #444; }
  input[type=month], input[type=text] { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #bbb; border-radius: 8px; margin-top: 4px; }
  button { display: block; width: 100%; padding: 14px; margin: 8px 0; font-size: 16px; border: none; border-radius: 8px; background: #1a73e8; color: #fff; cursor: pointer; }
  button.secundario { background: #555; }
  button.peligro { background: #c62828; }
  button:disabled { background: #aaa; }
  video { width: 100%; background: #000; border-radius: 8px; margin-top: 6px; }
  .estado { margin: 10px 0; padding: 10px; background: #eef3fb; border-radius: 8px; font-size: 15px; min-height: 22px; }
  .estado.error { background: #fdecea; color: #8a1c1c; }
  #resolucion { font-size: 12px; color: #666; margin: 4px 0 0; }
  #ultimo { font-size: 14px; font-weight: bold; margin: 6px 0; min-height: 18px; }
  #contador { font-size: 14px; color: #555; margin: 10px 0 4px; }
  .fila { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin: 6px 0; font-size: 14px; }
  .cdc { font-family: monospace; font-size: 11px; color: #555; word-break: break-all; margin-top: 4px; }
</style>
</head>
<body>
<h1>Lector QR de facturas SET</h1>

<label>Período (mes de emisión)
  <input type="month" id="periodo">
</label>

<button id="btnCamara">🎥 Iniciar cámara</button>
<button id="btnDetener" class="secundario" disabled>Detener cámara</button>
<video id="video" autoplay playsinline muted></video>
<div id="resolucion"></div>

<div id="estado" class="estado"></div>
<div id="ultimo"></div>

<label>O pega el enlace del QR
  <input type="text" id="manual" placeholder="https://ekuatia.set.gov.py/consultas/qr?...">
</label>
<button id="btnManual" class="secundario">Agregar enlace pegado</button>

<div id="contador"></div>
<div id="tabla"></div>

<button id="btnCompartir">💾 Guardar Excel en Drive</button>
<button id="btnBorrar" class="peligro">Borrar lista del período</button>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="parser.js"></script>
<script src="app.js"></script>
<script>
  // Registro del service worker (solo con HTTPS o localhost), para poder instalar la app.
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("./sw.js").catch(() => {});
</script>
</body>
</html>
